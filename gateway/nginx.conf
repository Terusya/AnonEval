server {
    set $internal_secret "${APP_INTERNAL_SECRET}";
    listen 80;
    server_tokens off;
    client_max_body_size 32k;

    location = /health {
        proxy_pass http://survey-service:8000/health;
    }

    location = /api/v1/auth/login {
        proxy_pass http://auth-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/password-reset/request {
        proxy_pass http://auth-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/v1/auth/password-reset/confirm {
        proxy_pass http://auth-service:8000;
        proxy_set_header Host $host;
    }

    location = /api/v1/auth/me {
        auth_request /_auth;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        auth_request_set $username $upstream_http_x_username;
        proxy_set_header X-User-ID $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Username $username;
        proxy_set_header X-Internal-Secret $internal_secret;
        proxy_pass http://auth-service:8000;
    }

    location ^~ /api/v1/auth/ {
        auth_request /_auth;
        proxy_pass http://auth-service:8000;
        proxy_set_header Host $host;
    }

    location /api/v1/ {
        auth_request /_auth;                                            #Проверяем сессию
        auth_request_set $user_id $upstream_http_x_user_id;             #Забираем ID из ответа auth
        auth_request_set $user_role $upstream_http_x_user_role;
        proxy_set_header X-User-ID $user_id;                            #Подставляем в запрос
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Internal-Secret $internal_secret;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://survey-service:8000;
    }

    location = /_auth {
        internal;                                                       #Недоступен снаружи
        proxy_pass http://auth-service:8000/internal/verify;
        proxy_pass_request_body off;                                    #Не передаем тело запроса (только заголовки)
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Internal-Secret $internal_secret;
    }

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }
}
